name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          bash -n hooks/risky-merge-guard.sh
          python -m py_compile scripts/escape-ledger.py
          jq . examples/settings.json > /dev/null
      - name: Hook tests
        run: bash tests/test_hook.sh
      - name: Ledger tests
        run: python -m unittest discover -s tests -v
